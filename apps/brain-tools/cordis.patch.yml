# @dsh-brain/brain-tools 的 bundle 补丁层。
#
# 只在「把本包当 bundle 安装」时生效。用 `node tools/install.mjs` 装的话，
# profile 的 cordis.patch.yml 里已经有等价条目，这个文件不会被用到。
#
# 两条经验写在这里，免得下次又踩：
#   1. 必须是 `- insert:` 结构 —— 裸条目（直接 `- id:`）在这个 DSH 版本里
#      会被当成「配置覆盖」而不是「插入新插件」，结果就是插件静默不加载。
#   2. 不写死库路径 —— 默认落点由 brain-home.js 从仓库位置推导，换机器不用改。
- insert:
    - id: brain-tools
      name: "@dsh-brain/brain-tools"
