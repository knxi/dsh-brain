  <text class="td" x="1133" y="490">relationship_states</text>

  <circle cx="1119" cy="516" r="3" fill="#f778ba"/>
  <text class="ts" x="1133" y="520">主动社交</text>
  <text class="td" x="1133" y="536">候选 / 评分 / 仲裁</text>

  <circle cx="1119" cy="562" r="3" fill="#f778ba"/>
  <text class="ts" x="1133" y="566">回复与沉默仲裁</text>
  <text class="td" x="1133" y="582">response_decisions</text>

  <line x1="1113" y1="604" x2="1347" y2="604" stroke="#252b36"/>
  <text class="td" x="1113" y="624">产出表</text>
  <text class="mono" x="1113" y="644">persona_profiles / versions</text>
  <text class="mono" x="1113" y="662">relationship_events</text>
  <text class="mono" x="1113" y="680">social_candidates / sends</text>
  <text class="td" x="1113" y="706">本次实例：关系事件 141 条</text>

  <!-- 系统 5 -->
  <rect class="box" x="1390" y="272" width="230" height="452" rx="12"/>
  <rect x="1390" y="272" width="230" height="4" rx="2" fill="#a5d6ff"/>
  <text class="lbl" x="1408" y="298">系统 5</text>
  <text class="t" x="1408" y="322">directives</text>
  <text class="ts" x="1408" y="342">自主指令</text>
  <line x1="1408" y1="354" x2="1602" y2="354" stroke="#252b36"/>

  <circle cx="1414" cy="378" r="3" fill="#a5d6ff"/>
  <text class="ts" x="1428" y="382">权限矩阵</text>
  <text class="td" x="1428" y="398">谁能做什么</text>

  <circle cx="1414" cy="424" r="3" fill="#a5d6ff"/>
  <text class="ts" x="1428" y="428">状态机</text>
  <text class="td" x="1428" y="444">指令生命周期</text>

  <circle cx="1414" cy="470" r="3" fill="#a5d6ff"/>
  <text class="ts" x="1428" y="474">指令对象</text>
  <text class="td" x="1428" y="490">结构化意图</text>

  <circle cx="1414" cy="516" r="3" fill="#a5d6ff"/>
  <text class="ts" x="1428" y="520">租约调度</text>
  <text class="td" x="1428" y="536">不抢跑不霸占</text>

  <circle cx="1414" cy="562" r="3" fill="#a5d6ff"/>
  <text class="ts" x="1428" y="566">内置动作</text>
  <text class="td" x="1428" y="582">候选转指令</text>

  <line x1="1408" y1="604" x2="1602" y2="604" stroke="#252b36"/>
  <text class="td" x="1408" y="624">零运行时依赖</text>
  <text class="td" x="1408" y="642">db / queue / clock /</text>
  <text class="td" x="1408" y="658">workspace / hooks 全注入</text>
  <text class="mono" x="1408" y="680">directives</text>
  <text class="mono" x="1408" y="698">directive_runs / steps</text>

  <!-- 数据源说明 -->
  <rect class="box" x="800" y="752" width="820" height="96" rx="12" stroke="#3a2a4a"/>
  <text class="lbl" x="820" y="776">共同数据落点</text>
  <text class="ts" x="820" y="800">三大系统全部读写同一个 brain.db，不另开了库</text>
  <text class="td" x="820" y="822">fox_state / fox_events  ← 小狐狸情感插件的真账也在这里，state.json 只是缓存</text>
  <text class="td" x="820" y="840">attention_focus · ws_events · ws_candidates  ← 工作空间的注意力与事件</text>

  <!-- 治理 -->
  <text class="sec" x="800" y="900">④ governance · 可治理性</text>
  <rect class="box" x="800" y="916" width="820" height="132" rx="12"/>
  <rect x="800" y="916" width="4" height="132" rx="2" fill="#e3b341"/>

  <text class="ts" x="820" y="942">独立删除账本</text>
  <text class="td" x="820" y="962">deletion_jobs / deletion_tombstones —— 删除留痕，可审计</text>

  <text class="ts" x="820" y="988">全量备份</text>
  <text class="td" x="820" y="1008">backups / blob_refs —— 恢复演练 24/24 通过</text>

  <text class="ts" x="820" y="1034">审计日志</text>
  <text class="mono" x="820" y="1054">audit_logs</text>
  <text class="td" x="900" y="1054">本次实例 40 条</text>

  <!-- 图例 -->
  <text class="sec" x="800" y="1100">⑤ 图例</text>
  <rect class="box" x="800" y="1116" width="820" height="132" rx="12"/>
  <rect x="820" y="1136" width="14" height="14" rx="3" fill="#58a6ff"/>
  <text class="ts" x="844" y="1148">入口层</text>
  <text class="td" x="844" y="1166">模型与记忆之间的两道门</text>

  <rect x="1020" y="1136" width="14" height="14" rx="3" fill="#bc8cff"/>
  <text class="ts" x="1044" y="1148">装配层</text>
  <text class="td" x="1044" y="1166">检索结果 → 上下文包</text>

  <rect x="1220" y="1136" width="14" height="14" rx="3" fill="#3fb950"/>
  <text class="ts" x="1244" y="1148">检索层</text>
  <text class="td" x="1244" y="1166">三路召回 + 融合</text>

  <rect x="1420" y="1136" width="14" height="14" rx="3" fill="#d29922"/>
  <text class="ts" x="1444" y="1148">存储层</text>
  <text class="td" x="1444" y="1166">唯一写入通道</text>

  <rect x="820" y="1200" width="14" height="14" rx="3" fill="#ff7b72"/>
