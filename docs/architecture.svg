  <text class="td" x="1133" y="398">版本冲突并列保留</text>

  <circle cx="1119" cy="424" r="3" fill="#f778ba"/>
  <text class="ts" x="1133" y="428">人物模型</text>
  <text class="td" x="1133" y="444">person_models</text>

  <circle cx="1119" cy="470" r="3" fill="#f778ba"/>
